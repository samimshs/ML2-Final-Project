<svg width="720" height="180" viewBox="0 0 720 180" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>KabulHub Logo</title>
  <desc>KabulHub full logo — radial neural hub icon with Inter 800 wordmark and tagline</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;800&amp;family=JetBrains+Mono:wght@300&amp;display=swap');
    </style>
  </defs>

  <!-- Icon background -->
  <rect x="0" y="0" width="180" height="180" rx="36" fill="#0A0F1E"/>

  <!-- Spokes -->
  <line x1="90" y1="90" x2="90"  y2="22"  stroke="#2563EB" stroke-width="1.5" opacity="0.55"/>
  <line x1="90" y1="90" x2="149" y2="42"  stroke="#2563EB" stroke-width="1.5" opacity="0.55"/>
  <line x1="90" y1="90" x2="157" y2="110" stroke="#2563EB" stroke-width="1.5" opacity="0.55"/>
  <line x1="90" y1="90" x2="122" y2="158" stroke="#2563EB" stroke-width="1.5" opacity="0.55"/>
  <line x1="90" y1="90" x2="58"  y2="158" stroke="#2563EB" stroke-width="1.5" opacity="0.45"/>
  <line x1="90" y1="90" x2="23"  y2="110" stroke="#2563EB" stroke-width="1.5" opacity="0.45"/>
  <line x1="90" y1="90" x2="31"  y2="42"  stroke="#2563EB" stroke-width="1.5" opacity="0.45"/>

  <!-- Cross-connections -->
  <line x1="90"  y1="22"  x2="149" y2="42"  stroke="#3B82F6" stroke-width="0.8" opacity="0.2"/>
  <line x1="149" y1="42"  x2="157" y2="110" stroke="#3B82F6" stroke-width="0.8" opacity="0.2"/>
  <line x1="157" y1="110" x2="122" y2="158" stroke="#3B82F6" stroke-width="0.8" opacity="0.2"/>
  <line x1="122" y1="158" x2="58"  y2="158" stroke="#3B82F6" stroke-width="0.8" opacity="0.15"/>
  <line x1="58"  y1="158" x2="23"  y2="110" stroke="#3B82F6" stroke-width="0.8" opacity="0.15"/>
  <line x1="23"  y1="110" x2="31"  y2="42"  stroke="#3B82F6" stroke-width="0.8" opacity="0.15"/>
  <line x1="31"  y1="42"  x2="90"  y2="22"  stroke="#3B82F6" stroke-width="0.8" opacity="0.2"/>

  <!-- Outer glow ring -->
  <circle cx="90" cy="90" r="62" fill="none" stroke="#1D4ED8" stroke-width="0.8" opacity="0.22"/>

  <!-- Outer nodes -->
  <circle cx="90"  cy="22"  r="6.5" fill="#1D4ED8" stroke="#3B82F6" stroke-width="1.5"/>
  <circle cx="149" cy="42"  r="5.5" fill="#1D4ED8" stroke="#3B82F6" stroke-width="1.2" opacity="0.9"/>
  <circle cx="157" cy="110" r="6.5" fill="#1D4ED8" stroke="#3B82F6" stroke-width="1.5"/>
  <circle cx="122" cy="158" r="5.5" fill="#1D4ED8" stroke="#3B82F6" stroke-width="1.2" opacity="0.85"/>
  <circle cx="58"  cy="158" r="5"   fill="#1D4ED8" stroke="#3B82F6" stroke-width="1.2" opacity="0.75"/>
  <circle cx="23"  cy="110" r="5.5" fill="#1D4ED8" stroke="#3B82F6" stroke-width="1.2" opacity="0.8"/>
  <circle cx="31"  cy="42"  r="5"   fill="#1D4ED8" stroke="#3B82F6" stroke-width="1.2" opacity="0.75"/>

  <!-- Outer node highlights -->
  <circle cx="90"  cy="22"  r="3"   fill="#60A5FA" opacity="0.9"/>
  <circle cx="149" cy="42"  r="2.5" fill="#60A5FA" opacity="0.7"/>
  <circle cx="157" cy="110" r="3"   fill="#60A5FA" opacity="0.9"/>
  <circle cx="122" cy="158" r="2.5" fill="#60A5FA" opacity="0.65"/>
  <circle cx="58"  cy="158" r="2"   fill="#60A5FA" opacity="0.6"/>
  <circle cx="23"  cy="110" r="2.5" fill="#60A5FA" opacity="0.65"/>
  <circle cx="31"  cy="42"  r="2"   fill="#60A5FA" opacity="0.6"/>

  <!-- Center hub glow rings -->
  <circle cx="90" cy="90" r="24" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.25"/>
  <circle cx="90" cy="90" r="17" fill="none" stroke="#2563EB" stroke-width="0.8" opacity="0.3"/>

  <!-- Center hub -->
  <circle cx="90" cy="90" r="13" fill="#1D4ED8"/>
  <circle cx="90" cy="90" r="8"  fill="#3B82F6"/>
  <circle cx="90" cy="90" r="4"  fill="#93C5FD"/>

  <!-- Divider -->
  <line x1="200" y1="22" x2="200" y2="158" stroke="#1E3A6E" stroke-width="1" opacity="0.5"/>

  <!-- Wordmark -->
  <text
    x="222"
    y="114"
    font-family="'Inter', 'Arial Black', sans-serif"
    font-weight="800"
    font-size="72"
    letter-spacing="-3"
    fill="#0A0F1E"
  >Kabul<tspan fill="#2563EB">Hub</tspan></text>

  <!-- Tagline -->
  <text
    x="224"
    y="146"
    font-family="'JetBrains Mono', 'Courier New', monospace"
    font-weight="300"
    font-size="14"
    letter-spacing="3"
    fill="#64748B"
  >AI · ML · DATA SCIENCE</text>

</svg>
