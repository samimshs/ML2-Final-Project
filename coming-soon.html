<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fb">
    <meta name="description" content="KabulHub is preparing a new website. Coming soon.">
    <meta property="og:title" content="KabulHub | Coming Soon">
    <meta property="og:description" content="Our new website is under construction and will be available soon.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/branding/04-logo-horizontal-light.svg">
    <meta name="twitter:card" content="summary_large_image">
    <title>KabulHub | Coming Soon</title>
    <link rel="icon" href="assets/branding/11-favicon-32.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        if (window.lucide) window.lucide.createIcons();
      });
    </script>
  </head>
  <body class="coming-soon-page">
    <main class="coming-soon-shell" aria-labelledby="coming-soon-title">
      <img class="coming-soon-logo" src="assets/branding/06-logo-horizontal-transparent.svg" alt="KabulHub">
      <section class="coming-soon-panel">
        <p class="section-kicker">Website Under Construction</p>
        <h1 id="coming-soon-title">Coming soon...</h1>
        <p>We are preparing the official KabulHub website and will be back online shortly.</p>
        <a class="coming-soon-email" href="mailto:info@kabulhub.com">
          <i data-lucide="mail"></i>
          <span>info@kabulhub.com</span>
        </a>
      </section>
    </main>
  </body>
</html>
