<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fb">
    <meta name="description" content="Education products by Samim.">
    <title>Education | Sami Samim</title>
    <link rel="icon" href="/assets/global_icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        if (window.lucide) window.lucide.createIcons();
      });
    </script>
  </head>
  <body class="directory-page">
    <main class="directory-shell">
      <header class="directory-header">
        <a class="back-link" href="index.html">
          <i data-lucide="arrow-left"></i>
          Home
        </a>
        <div>
          <p class="landing-kicker">Category</p>
          <h1>Education</h1>
          <p>Learning products designed for accessible, multilingual education.</p>
        </div>
      </header>

      <section class="project-list" aria-label="Education project list">
        <article class="project-row">
          <span class="project-row-icon education-icon" aria-hidden="true">
            <i data-lucide="graduation-cap"></i>
          </span>
          <span>
            <strong>PohaRana</strong>
            <small>پوهه رڼا: a bilingual Afghan ed-tech MVP combining structured course pathways, bite-sized YouTube lessons, and required quiz checkpoints.</small>
          </span>
          <i data-lucide="book-open-check"></i>
        </article>
      </section>
    </main>
  </body>
</html>
